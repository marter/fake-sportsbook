# Host ports are offset from volunteer-scheduler's (5432/8000/5173) so both stacks can run at once.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sportsbook
      POSTGRES_PASSWORD: sportsbook
      POSTGRES_DB: fake_sportsbook
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sportsbook -d fake_sportsbook"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    command: sh -c "uv sync --frozen --no-dev && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app"
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://sportsbook:sportsbook@db:5432/fake_sportsbook
      CORS_ORIGINS: '["http://localhost:5174"]'
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:24-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host --port 5174"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5174:5174"
    environment:
      VITE_API_BASE_URL: http://localhost:8001
    depends_on:
      - backend

volumes:
  db_data:
  backend_venv:
  frontend_node_modules:
