# Production stack for one server. No ports are published: the shared Caddy container
# (deploy/caddy) reaches backend and frontend over the external "web" network.
#
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod up -d --build

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sportsbook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in deploy/.env.prod}
      POSTGRES_DB: fake_sportsbook
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sportsbook -d fake_sportsbook"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  backend:
    build: ../backend
    restart: unless-stopped
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://sportsbook:${POSTGRES_PASSWORD}@db:5432/fake_sportsbook
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set in deploy/.env.prod}
      ODDS_API_KEY: ${ODDS_API_KEY:-}
      CORS_ORIGINS: '["https://${SPORTSBOOK_HOST:?set in deploy/.env.prod}"]'
    depends_on:
      db:
        condition: service_healthy
    networks:
      default:
      web:
        aliases: [sportsbook-backend]
    logging: *logging

  frontend:
    build: ../frontend
    restart: unless-stopped
    networks:
      web:
        aliases: [sportsbook-frontend]
    logging: *logging

volumes:
  db_data:

networks:
  web:
    external: true
